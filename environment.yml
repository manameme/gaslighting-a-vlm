# Environment notes (no conda environment is used since the move to Kaggle).
#
# GPU runs (Kaggle notebook): Kaggle's preinstalled PyTorch, plus these pins,
# installed by scripts/kaggle_runner.ipynb:
#   transformers==4.57.6  accelerate==1.10.1  bitsandbytes==0.49.2
# The exact versions used (including torch) are printed by the notebook and
# written into the "_meta" header line of every result file.
#
# CPU tests (laptop): python3 -m venv .venv
#                     ./.venv/bin/pip install numpy pyyaml pillow pytest
#
# Kept as a conda file so `conda env create -f environment.yml` also works for
# the CPU tests if anyone prefers conda.
name: vlmsyc-cpu
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - pyyaml
  - pillow
  - pytest
